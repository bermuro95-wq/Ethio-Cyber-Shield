<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid py-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="page-title mb-0"><i class="bi bi-people me-2 text-success"></i>Users & roles</h3>
            <button class="btn btn-success btn-sm" id="btnAdd" onclick="openCreate()">Add user</button>
        </div>
        <p class="text-muted small">Roles: <strong>admin</strong> (full), <strong>analyst</strong> (investigate / edit), <strong>viewer</strong> (read-only).</p>
        <div class="card"><div class="card-body p-0" id="tableArea"></div></div>
    </div>
    <div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add user</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="uId">
            <div class="mb-2"><label class="form-label">Full name</label><input class="form-control" id="uName"></div>
            <div class="mb-2" id="emailRow"><label class="form-label">Email</label><input class="form-control" id="uEmail" type="email"></div>
            <div class="mb-2"><label class="form-label">Role</label>
                <select class="form-select" id="uRole">
                    <option value="analyst">Analyst</option>
                    <option value="viewer">Viewer</option>
                    <option value="admin">Admin</option>
                </select></div>
            <div class="mb-2"><label class="form-label">Password</label><input class="form-control" id="uPass" type="password" placeholder="Min 8 chars"></div>
            <div class="form-check" id="activeRow" style="display:none">
                <input class="form-check-input" type="checkbox" id="uActive" checked>
                <label class="form-check-label" for="uActive">Active</label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-success" onclick="saveUser()">Save</button>
        </div>
    </div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) {}
        document.getElementById('navbar').innerHTML = renderNavbar('users');
        const me = API.getUser() || {};
        if (me.role !== 'admin') document.getElementById('btnAdd').style.display = 'none';
        let modal;

        async function load() {
            try {
                const users = await API.getUsers();
                const canAdmin = me.role === 'admin';
                const rows = users.map(u => `
                    <tr>
                        <td>${escapeHtml(u.full_name)}</td>
                        <td>${escapeHtml(u.email)}</td>
                        <td><span class="badge bg-secondary">${escapeHtml(u.role)}</span></td>
                        <td>${u.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-danger">Off</span>'}</td>
                        <td class="small">${formatDate(u.created_at)}</td>
                        <td>${canAdmin ? `
                            <button class="btn btn-outline-info btn-sm me-1" onclick='editUser(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Edit</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deactivate('${u.id}')">Deactivate</button>
                        ` : '-'}</td>
                    </tr>`).join('');
                document.getElementById('tableArea').innerHTML = `
                    <table class="table table-hover mb-0"><thead><tr>
                        <th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th>
                    </tr></thead><tbody>${rows}</tbody></table>`;
            } catch (e) {
                document.getElementById('tableArea').innerHTML = noData(e.message);
            }
        }
        function openCreate() {
            document.getElementById('modalTitle').textContent = 'Add user';
            document.getElementById('uId').value = '';
            document.getElementById('uName').value = '';
            document.getElementById('uEmail').value = '';
            document.getElementById('uPass').value = '';
            document.getElementById('uRole').value = 'analyst';
            document.getElementById('emailRow').style.display = '';
            document.getElementById('activeRow').style.display = 'none';
            modal.show();
        }
        function editUser(u) {
            document.getElementById('modalTitle').textContent = 'Edit user';
            document.getElementById('uId').value = u.id;
            document.getElementById('uName').value = u.full_name || '';
            document.getElementById('uEmail').value = u.email || '';
            document.getElementById('uRole').value = u.role || 'viewer';
            document.getElementById('uPass').value = '';
            document.getElementById('uActive').checked = !!u.is_active;
            document.getElementById('emailRow').style.display = 'none';
            document.getElementById('activeRow').style.display = '';
            modal.show();
        }
        async function saveUser() {
            const id = document.getElementById('uId').value;
            try {
                if (id) {
                    const payload = {
                        full_name: document.getElementById('uName').value.trim(),
                        role: document.getElementById('uRole').value,
                        is_active: document.getElementById('uActive').checked
                    };
                    const p = document.getElementById('uPass').value;
                    if (p) payload.password = p;
                    await API.updateUser(id, payload);
                } else {
                    await API.createUser({
                        full_name: document.getElementById('uName').value.trim(),
                        email: document.getElementById('uEmail').value.trim(),
                        password: document.getElementById('uPass').value,
                        role: document.getElementById('uRole').value
                    });
                }
                modal.hide();
                showToast('Saved');
                load();
            } catch (e) { showToast(e.message, 'error'); }
        }
        async function deactivate(id) {
            if (!confirm('Deactivate this user?')) return;
            try { await API.deleteUser(id); showToast('Deactivated'); load(); }
            catch (e) { showToast(e.message, 'error'); }
        }
        modal = new bootstrap.Modal(document.getElementById('userModal'));
        load();
    </script>
</body>
</html>
