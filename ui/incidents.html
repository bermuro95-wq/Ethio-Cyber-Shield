<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="assets/logo-shield.jpg">
    <title>Incidents | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid py-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="page-title mb-0"><i class="bi bi-exclamation-triangle me-2 text-success"></i>Incidents</h3>
            <span class="badge bg-dark border border-secondary text-muted"><i class="bi bi-robot me-1 text-success"></i>Automated Threat Correlation</span>
        </div>

        <!-- Filters -->
        <div class="card mb-3">
            <div class="card-body py-2">
                <div class="row g-2 align-items-center">
                    <div class="col-md-3">
                        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search title...">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterStatus">
                            <option value="">All Status</option>
                            <option value="open">Open</option>
                            <option value="investigating">Investigating</option>
                            <option value="contained">Contained</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterSeverity">
                            <option value="">All Severity</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterType">
                            <option value="">All Types</option>
                            <option value="phishing">Phishing</option>
                            <option value="account_takeover">Account Takeover</option>
                            <option value="suspicious_login">Suspicious Login</option>
                            <option value="fraud">Fraud</option>
                            <option value="malware">Malware</option>
                            <option value="social_engineering">Social Engineering</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-success btn-sm w-100" onclick="loadIncidents()">Filter</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0" id="incidentTable">
                <div class="text-center py-5"><div class="spinner-border text-success"></div></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) { /* redirect */ }
        document.getElementById('navbar').innerHTML = renderNavbar('incidents');

        async function loadIncidents() {
            loadingSpinner('incidentTable');
            try {
                const params = {};
                const s = document.getElementById('searchInput').value.trim();
                const st = document.getElementById('filterStatus').value;
                const sev = document.getElementById('filterSeverity').value;
                const ty = document.getElementById('filterType').value;
                if (s) params.search = s;
                if (st) params.status = st;
                if (sev) params.severity = sev;
                if (ty) params.type = ty;

                const data = await API.getIncidents(params);
                if (!data || data.length === 0) {
                    document.getElementById('incidentTable').innerHTML = noData();
                    return;
                }
                const rows = data.map(i => `
                    <tr>
                        <td><a href="incident-detail.html?id=${i.id}" class="text-success text-decoration-none fw-semibold">${escapeHtml(i.title)}</a></td>
                        <td class="text-capitalize small">${(i.incident_type||'').replace(/_/g,' ')}</td>
                        <td>${severityBadge(i.severity)}</td>
                        <td>${statusBadge(i.status)}</td>
                        <td>${riskBadge(i.risk_level)}</td>
                        <td class="small text-muted">${formatDate(i.incident_date || i.created_at)}</td>
                    </tr>
                `).join('');
                document.getElementById('incidentTable').innerHTML = `
                    <table class="table table-hover mb-0">
                        <thead><tr>
                            <th>Title</th><th>Type</th><th>Severity</th><th>Status</th><th>Risk</th><th>Date</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>`;
            } catch (e) {
                showToast(e.message, 'error');
                document.getElementById('incidentTable').innerHTML = noData(e.message);
            }
        }

        loadIncidents();
    </script>
</body>
</html>
