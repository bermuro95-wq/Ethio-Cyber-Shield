<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="assets/logo-shield.jpg">
    <title>Incidents | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <div class="container-fluid py-3 px-3 px-md-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary gap-2">
            <div class="d-flex align-items-center gap-3">
                <h4 class="mb-0 fw-bold text-light">Security Incidents</h4>
                <span class="badge bg-dark border border-secondary text-muted font-mono">
                    <i class="bi bi-robot text-success me-1"></i>Automated Correlation
                </span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-soc btn-soc-primary btn-sm" id="btnRefresh" onclick="manualRefreshIncidents()">
                    <i class="bi bi-arrow-repeat me-1"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="card mb-3">
            <div class="card-body py-2">
                <div class="row g-2 align-items-center">
                    <div class="col-md-3">
                        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search title or ID..." oninput="debounceIncidentSearch()">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterStatus" onchange="loadIncidents()">
                            <option value="">All Statuses</option>
                            <option value="open">Open</option>
                            <option value="investigating">Investigating</option>
                            <option value="contained">Contained</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterSeverity" onchange="loadIncidents()">
                            <option value="">All Severities</option>
                            <option value="critical">Critical</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select form-select-sm" id="filterType" onchange="loadIncidents()">
                            <option value="">All Incident Types</option>
                            <option value="account_takeover">Account Takeover (ATO)</option>
                            <option value="suspicious_login">Suspicious Login</option>
                            <option value="fraud">Fraud / Unauthorized Transfer</option>
                            <option value="malware">Malware / Bot</option>
                            <option value="other">Other Detections</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-soc btn-sm w-100" onclick="loadIncidents()">Filter</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Incidents Table -->
        <div class="card">
            <div class="card-body p-0" id="incidentTable">
                <div class="text-center py-5"><div class="spinner-border text-success"></div></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) { /* redirect */ }

        document.getElementById('navbar').innerHTML = renderNavbar('incidents');

        let _incSearchDebounce = null;
        function debounceIncidentSearch() {
            clearTimeout(_incSearchDebounce);
            _incSearchDebounce = setTimeout(() => loadIncidents(true), 300);
        }

        async function loadIncidents(silent = false) {
            if (!silent) loadingSpinner('incidentTable');
            try {
                const params = {};
                const s = document.getElementById('searchInput').value.trim();
                const st = document.getElementById('filterStatus').value;
                const sev = document.getElementById('filterSeverity').value;
                const ty = document.getElementById('filterType').value;
                if (s) params.search = s;
                if (st) params.status = st;
                if (sev) params.severity = sev;
                if (ty) params.type = ty;

                const data = await API.getIncidents(params);
                if (!data || data.length === 0) {
                    document.getElementById('incidentTable').innerHTML = noData('No incidents matching filter criteria.');
                    return;
                }

                const rows = data.map(i => `
                    <tr>
                        <td>
                            <a href="incident-detail.html?id=${i.id}" class="text-decoration-none fw-semibold text-light d-flex align-items-center gap-1">
                                <i class="bi bi-shield-exclamation text-warning"></i>
                                <span>${escapeHtml(i.title)}</span>
                            </a>
                            <div class="small text-muted font-mono">${(i.id || '').slice(0, 12)}...</div>
                        </td>
                        <td><span class="badge bg-dark border border-secondary text-light font-mono">${escapeHtml((i.incident_type || '').replace(/_/g, ' ').toUpperCase())}</span></td>
                        <td>${severityBadge(i.severity)}</td>
                        <td>${statusBadge(i.status)}</td>
                        <td>
                            ${i.risk_level ? `<span class="badge bg-dark border border-secondary font-mono text-warning">Risk ${escapeHtml(i.risk_level)}</span>` : '-'}
                        </td>
                        <td class="small font-mono text-dim">${formatDate(i.incident_date || i.created_at)}</td>
                        <td>
                            <a href="incident-detail.html?id=${i.id}" class="btn btn-soc btn-soc-sm font-mono">
                                Manage &rarr;
                            </a>
                        </td>
                    </tr>
                `).join('');

                document.getElementById('incidentTable').innerHTML = `
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Incident Title</th>
                                    <th>Classification</th>
                                    <th>Severity</th>
                                    <th>Status</th>
                                    <th>Risk Posture</th>
                                    <th>Reported (EAT)</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            } catch (err) {
                if (!silent) {
                    showToast(err.message, 'error');
                    document.getElementById('incidentTable').innerHTML = noData(err.message);
                }
            }
        }

        async function manualRefreshIncidents() {
            const btn = document.getElementById('btnRefresh');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Refreshing...';
            }
            await loadIncidents(false);
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i> Refresh';
            }
            showToast('Incidents refreshed', 'success');
        }

        loadIncidents();
    </script>
</body>
</html>
