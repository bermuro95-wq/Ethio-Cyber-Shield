<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Ethio-Cyber Shield</title>
    <link rel="icon" type="image/jpeg" href="assets/logo-shield.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root { --eth-green: #078930; --eth-yellow: #FCDD09; --eth-red: #DA121A; --eth-blue: #0F47AF; }
        body { margin: 0; min-height: 100vh; background: #020406; font-family: 'Segoe UI', system-ui, sans-serif; }
        .bg-cyber {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(135deg, rgba(2,4,6,0.88) 0%, rgba(2,4,6,0.55) 50%, rgba(2,4,6,0.85) 100%),
                        url('assets/logo-cyber-flag.jpg') center / cover no-repeat;
        }
        .wrap {
            position: relative; z-index: 10; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 1.25rem;
        }
        .card-reset {
            width: 100%; max-width: 420px;
            background: rgba(8,12,18,0.92); backdrop-filter: blur(20px);
            border: 1px solid rgba(7,137,48,0.4); border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7); overflow: hidden;
        }
        .accent {
            height: 5px;
            background: linear-gradient(90deg, var(--eth-green), var(--eth-yellow), var(--eth-red), var(--eth-blue));
        }
        .inner { padding: 1.75rem 1.85rem; }
        .shield { width: 72px; height: 72px; object-fit: contain; display: block; margin: 0 auto 1rem;
            filter: drop-shadow(0 0 12px rgba(252,221,9,0.4)); border-radius: 8px; }
        h1 { font-size: 1.35rem; font-weight: 800; text-align: center; color: #e6edf3; margin-bottom: 0.35rem; }
        .sub { text-align: center; color: #8b949e; font-size: 0.85rem; margin-bottom: 1.25rem; }
        .form-control {
            background: rgba(16,22,30,0.95); border: 1px solid #30363d; border-radius: 12px;
            color: #e6edf3; padding: 0.75rem 1rem 0.75rem 2.6rem;
        }
        .form-control:focus {
            background: #121820; border-color: var(--eth-green);
            box-shadow: 0 0 0 3px rgba(7,137,48,0.25); color: #e6edf3;
        }
        .ig { position: relative; margin-bottom: 0.9rem; }
        .ig i.left { position: absolute; left: 0.95rem; top: 50%; transform: translateY(-50%); color: #6e7681; }
        .toggle-pass {
            position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #6e7681; cursor: pointer; font-size: 1.1rem;
        }
        .toggle-pass:hover { color: var(--eth-yellow); }
        .btn-go {
            width: 100%; padding: 0.85rem; border: none; border-radius: 12px; font-weight: 700;
            background: linear-gradient(135deg, var(--eth-green), #00a84f 40%, var(--eth-yellow));
            color: #000; box-shadow: 0 4px 20px rgba(7,137,48,0.4);
        }
        .btn-go:hover { color: #000; filter: brightness(1.05); }
        .btn-go:disabled { opacity: 0.7; }
        .msg-err { background: rgba(218,18,26,0.2); border: 1px solid rgba(218,18,26,0.45); color: #ff8a8a; border-radius: 10px; padding: 0.65rem 0.9rem; font-size: 0.88rem; }
        .msg-ok { background: rgba(7,137,48,0.2); border: 1px solid rgba(7,137,48,0.45); color: #3dd68c; border-radius: 10px; padding: 0.65rem 0.9rem; font-size: 0.88rem; }
        a.back { color: #8b949e; font-size: 0.85rem; text-decoration: none; }
        a.back:hover { color: var(--eth-green); }
    </style>
</head>
<body>
    <div class="bg-cyber"></div>
    <div class="wrap">
        <div class="card-reset">
            <div class="accent"></div>
            <div class="inner">
                <img src="assets/logo-shield.jpg" alt="ECS" class="shield">
                <h1>Reset Password</h1>
                <p class="sub">Set a new password for your account</p>

                <form id="resetForm">
                    <div class="ig">
                        <input type="password" class="form-control" id="newPass" required minlength="8" placeholder="New password (min 8 chars)">
                        <i class="bi bi-shield-lock left"></i>
                        <button type="button" class="toggle-pass" data-target="newPass"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="ig">
                        <input type="password" class="form-control" id="confirmPass" required minlength="8" placeholder="Confirm new password">
                        <i class="bi bi-shield-check left"></i>
                        <button type="button" class="toggle-pass" data-target="confirmPass"><i class="bi bi-eye"></i></button>
                    </div>
                    <div id="msg" class="d-none mb-3"></div>
                    <button type="submit" class="btn btn-go" id="resetBtn">Update Password</button>
                </form>
                <p class="text-center mt-3 mb-0"><a href="login.html" class="back"><i class="bi bi-arrow-left"></i> Back to login</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        if (!token) {
            document.getElementById('msg').className = 'msg-err mb-3';
            document.getElementById('msg').textContent = 'Missing reset token. Use the link from Forgot Password.';
            document.getElementById('resetBtn').disabled = true;
        }

        document.querySelectorAll('.toggle-pass').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = document.getElementById(this.dataset.target);
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'bi bi-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'bi bi-eye';
                }
            });
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('resetBtn');
            if (p1 !== p2) {
                msg.className = 'msg-err mb-3';
                msg.textContent = 'Passwords do not match.';
                return;
            }
            if (p1.length < 8) {
                msg.className = 'msg-err mb-3';
                msg.textContent = 'Password must be at least 8 characters.';
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Updating...';
            try {
                const res = await API.resetPassword(token, p1);
                msg.className = 'msg-ok mb-3';
                msg.textContent = res.message || 'Password updated. Redirecting to login...';
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } catch (ex) {
                msg.className = 'msg-err mb-3';
                msg.textContent = ex.message || 'Reset failed.';
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
