<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlists | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid py-4 px-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <h3 class="page-title mb-0"><i class="bi bi-eye me-2 text-success"></i>Watchlists</h3>
            <div class="d-flex gap-2">
                <button class="btn btn-success btn-sm" id="btnAdd" onclick="openCreate()"><i class="bi bi-plus"></i> Add</button>
                <button class="btn btn-outline-warning btn-sm" id="btnClear" onclick="clearAll()">Clear / Deactivate all</button>
            </div>
        </div>
        <p class="text-muted small">Matched on every new transaction (account, device, IP). Hits raise risk score and appear in reasons.</p>
        <div class="card">
            <div class="card-body p-0" id="tableArea">
                <div class="text-center py-4"><div class="spinner-border text-success spinner-border-sm"></div></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add watchlist</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-2"><label class="form-label">Entity type</label>
                        <select class="form-select" id="wType">
                            <option value="account">Account</option>
                            <option value="device">Device</option>
                            <option value="ip">IP</option>
                            <option value="email">Email</option>
                            <option value="domain">Domain</option>
                        </select></div>
                    <div class="mb-2"><label class="form-label">Value</label>
                        <input class="form-control" id="wValue" placeholder="e.g. account or device id"></div>
                    <div class="mb-2"><label class="form-label">Label</label>
                        <input class="form-control" id="wLabel" placeholder="Optional label"></div>
                    <div class="mb-2"><label class="form-label">Severity</label>
                        <select class="form-select" id="wSev">
                            <option value="medium">Medium</option>
                            <option value="high" selected>High</option>
                            <option value="critical">Critical</option>
                            <option value="low">Low</option>
                        </select></div>
                    <div class="mb-2"><label class="form-label">Notes</label>
                        <textarea class="form-control" id="wNotes" rows="2"></textarea></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="wActive" checked>
                        <label class="form-check-label" for="wActive">Active</label></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="saveItem()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) {}
        document.getElementById('navbar').innerHTML = renderNavbar('watchlists');
        const role = (API.getUser() || {}).role;
        if (role === 'viewer') {
            document.getElementById('btnAdd').style.display = 'none';
            document.getElementById('btnClear').style.display = 'none';
        }
        if (role !== 'admin') document.getElementById('btnClear').style.display = 'none';
        let modal;

        async function load() {
            try {
                const data = await API.getWatchlists();
                if (!data.length) {
                    document.getElementById('tableArea').innerHTML = noData('No watchlist entries yet.');
                    return;
                }
                const canEdit = role === 'admin' || role === 'analyst';
                const rows = data.map(w => `
                    <tr>
                        <td><span class="badge bg-secondary">${escapeHtml(w.entity_type)}</span></td>
                        <td><code>${escapeHtml(w.value)}</code></td>
                        <td>${escapeHtml(w.label || '-')}</td>
                        <td>${severityBadge(w.severity)}</td>
                        <td>${w.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Off</span>'}</td>
                        <td class="small text-muted">${escapeHtml((w.notes||'').slice(0,80))}</td>
                        <td class="text-nowrap">
                            ${canEdit ? `<button class="btn btn-outline-info btn-sm me-1" onclick='editItem(${JSON.stringify(w).replace(/'/g,"&#39;")})'>Edit</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="delItem('${w.id}')">Delete</button>` : '-'}
                        </td>
                    </tr>`).join('');
                document.getElementById('tableArea').innerHTML = `
                    <table class="table table-hover mb-0"><thead><tr>
                        <th>Type</th><th>Value</th><th>Label</th><th>Severity</th><th>Status</th><th>Notes</th><th>Actions</th>
                    </tr></thead><tbody>${rows}</tbody></table>`;
            } catch (e) {
                document.getElementById('tableArea').innerHTML = noData(e.message);
            }
        }

        function openCreate() {
            document.getElementById('modalTitle').textContent = 'Add watchlist';
            document.getElementById('editId').value = '';
            document.getElementById('wValue').value = '';
            document.getElementById('wLabel').value = '';
            document.getElementById('wNotes').value = '';
            document.getElementById('wActive').checked = true;
            modal.show();
        }
        function editItem(w) {
            document.getElementById('modalTitle').textContent = 'Edit watchlist';
            document.getElementById('editId').value = w.id;
            document.getElementById('wType').value = w.entity_type;
            document.getElementById('wValue').value = w.value;
            document.getElementById('wLabel').value = w.label || '';
            document.getElementById('wSev').value = w.severity || 'high';
            document.getElementById('wNotes').value = w.notes || '';
            document.getElementById('wActive').checked = !!w.is_active;
            modal.show();
        }
        async function saveItem() {
            const id = document.getElementById('editId').value;
            const payload = {
                entity_type: document.getElementById('wType').value,
                value: document.getElementById('wValue').value.trim(),
                label: document.getElementById('wLabel').value.trim(),
                severity: document.getElementById('wSev').value,
                notes: document.getElementById('wNotes').value.trim(),
                is_active: document.getElementById('wActive').checked
            };
            if (!payload.value) { showToast('Value required', 'error'); return; }
            try {
                if (id) await API.updateWatchlist(id, payload);
                else await API.createWatchlist(payload);
                modal.hide();
                showToast('Saved');
                load();
            } catch (e) { showToast(e.message, 'error'); }
        }
        async function delItem(id) {
            if (!confirm('Delete this watchlist entry?')) return;
            try { await API.deleteWatchlist(id); showToast('Deleted'); load(); }
            catch (e) { showToast(e.message, 'error'); }
        }
        async function clearAll() {
            if (!confirm('Deactivate ALL watchlist entries?')) return;
            try { await API.clearWatchlists('deactivate'); showToast('Deactivated'); load(); }
            catch (e) { showToast(e.message, 'error'); }
        }
        modal = new bootstrap.Modal(document.getElementById('editModal'));
        load();
    </script>
</body>
</html>
