<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="assets/logo-shield.jpg">
    <title>Audit Log | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid py-4 px-4">
        <h3 class="page-title mb-4"><i class="bi bi-journal-text me-2 text-success"></i>Audit Log</h3>
        <p class="text-muted small">Immutable record of system actions. Users cannot edit these entries.</p>

        <div class="card">
            <div class="card-body p-0" id="tableArea">
                <div class="text-center py-5"><div class="spinner-border text-success"></div></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth(['admin', 'analyst'])) { /* redirect */ }
        document.getElementById('navbar').innerHTML = renderNavbar('audit');

        async function loadAudit() {
            loadingSpinner('tableArea');
            try {
                const data = await API.getAuditLogs({ limit: 200 });
                if (!data.length) {
                    document.getElementById('tableArea').innerHTML = noData();
                    return;
                }
                const rows = data.map(a => `
                    <tr>
                        <td class="small">${formatDate(a.created_at)}</td>
                        <td class="small">${escapeHtml(a.user?.full_name || a.user_id || 'System')}</td>
                        <td><code class="small">${escapeHtml(a.action)}</code></td>
                        <td class="small text-muted">${escapeHtml(a.entity_type || '-')}</td>
                        <td class="small text-muted text-truncate" style="max-width:200px">${escapeHtml(JSON.stringify(a.details || {}))}</td>
                        <td class="small text-muted">${escapeHtml(a.ip_address || '-')}</td>
                    </tr>
                `).join('');
                document.getElementById('tableArea').innerHTML = `
                    <table class="table table-sm table-hover mb-0">
                        <thead><tr>
                            <th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th><th>IP</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>`;
            } catch (e) {
                document.getElementById('tableArea').innerHTML = noData(e.message);
            }
        }
        loadAudit();
    </script>
</body>
</html>
