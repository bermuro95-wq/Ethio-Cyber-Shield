<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="assets/logo-shield.jpg">
    <title>Incidents | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid py-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="page-title mb-0"><i class="bi bi-exclamation-triangle me-2 text-success"></i>Incidents</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal" id="btnCreate">
                <i class="bi bi-plus-lg me-1"></i> New Incident
            </button>
        </div>

        <!-- Filters -->
        <div class="card mb-3">
            <div class="card-body py-2">
                <div class="row g-2 align-items-center">
                    <div class="col-md-3">
                        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search title...">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterStatus">
                            <option value="">All Status</option>
                            <option value="open">Open</option>
                            <option value="investigating">Investigating</option>
                            <option value="contained">Contained</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterSeverity">
                            <option value="">All Severity</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select form-select-sm" id="filterType">
                            <option value="">All Types</option>
                            <option value="phishing">Phishing</option>
                            <option value="account_takeover">Account Takeover</option>
                            <option value="suspicious_login">Suspicious Login</option>
                            <option value="fraud">Fraud</option>
                            <option value="malware">Malware</option>
                            <option value="social_engineering">Social Engineering</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-success btn-sm w-100" onclick="loadIncidents()">Filter</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0" id="incidentTable">
                <div class="text-center py-5"><div class="spinner-border text-success"></div></div>
            </div>
        </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Incident</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createForm">
                        <div class="mb-3">
                            <label class="form-label">Title *</label>
                            <input type="text" class="form-control" id="cTitle" required maxlength="255">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="cDesc" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Type *</label>
                                <select class="form-select" id="cType" required>
                                    <option value="phishing">Phishing</option>
                                    <option value="account_takeover">Account Takeover</option>
                                    <option value="suspicious_login">Suspicious Login</option>
                                    <option value="fraud">Fraud</option>
                                    <option value="malware">Malware</option>
                                    <option value="social_engineering">Social Engineering</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Severity *</label>
                                <select class="form-select" id="cSeverity" required>
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="cStatus">
                                    <option value="open" selected>Open</option>
                                    <option value="investigating">Investigating</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="submitCreate()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) { /* redirect */ }
        document.getElementById('navbar').innerHTML = renderNavbar('incidents');
        const user = API.getUser();
        if (user.role === 'viewer') document.getElementById('btnCreate').style.display = 'none';

        async function loadIncidents() {
            loadingSpinner('incidentTable');
            try {
                const params = {};
                const s = document.getElementById('searchInput').value.trim();
                const st = document.getElementById('filterStatus').value;
                const sev = document.getElementById('filterSeverity').value;
                const ty = document.getElementById('filterType').value;
                if (s) params.search = s;
                if (st) params.status = st;
                if (sev) params.severity = sev;
                if (ty) params.type = ty;

                const data = await API.getIncidents(params);
                if (!data || data.length === 0) {
                    document.getElementById('incidentTable').innerHTML = noData();
                    return;
                }
                const rows = data.map(i => `
                    <tr>
                        <td><a href="incident-detail.html?id=${i.id}" class="text-success text-decoration-none fw-semibold">${escapeHtml(i.title)}</a></td>
                        <td class="text-capitalize small">${(i.incident_type||'').replace(/_/g,' ')}</td>
                        <td>${severityBadge(i.severity)}</td>
                        <td>${statusBadge(i.status)}</td>
                        <td>${riskBadge(i.risk_level)}</td>
                        <td class="small text-muted">${formatDate(i.incident_date || i.created_at)}</td>
                    </tr>
                `).join('');
                document.getElementById('incidentTable').innerHTML = `
                    <table class="table table-hover mb-0">
                        <thead><tr>
                            <th>Title</th><th>Type</th><th>Severity</th><th>Status</th><th>Risk</th><th>Date</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>`;
            } catch (e) {
                showToast(e.message, 'error');
                document.getElementById('incidentTable').innerHTML = noData(e.message);
            }
        }

        async function submitCreate() {
            const payload = {
                title: document.getElementById('cTitle').value.trim(),
                description: document.getElementById('cDesc').value.trim(),
                incident_type: document.getElementById('cType').value,
                severity: document.getElementById('cSeverity').value,
                status: document.getElementById('cStatus').value
            };
            if (!payload.title) { showToast('Title required', 'error'); return; }
            try {
                const inc = await API.createIncident(payload);
                showToast('Incident created');
                bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
                document.getElementById('createForm').reset();
                loadIncidents();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        loadIncidents();
    </script>
</body>
</html>
