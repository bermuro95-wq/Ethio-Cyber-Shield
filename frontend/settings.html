<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid py-4 px-4">
        <h3 class="page-title mb-3"><i class="bi bi-sliders me-2 text-success"></i>Rule thresholds</h3>
        <p class="text-muted small">Admin only. Changes apply to the next transaction analysis (no restart needed).</p>
        <div class="card">
            <div class="card-body">
                <div class="row g-3" id="fields"></div>
                <button class="btn btn-success mt-3" id="btnSave" onclick="save()">Save thresholds</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) {}
        document.getElementById('navbar').innerHTML = renderNavbar('settings');
        const role = (API.getUser() || {}).role;
        const labels = {
            high_amount: 'High amount (ETB)',
            critical_amount: 'Critical amount (ETB)',
            night_amount: 'Night-time amount threshold (ETB)',
            burst_count: 'Burst transaction count',
            burst_window_minutes: 'Burst window (minutes)',
            velocity_amount: 'Velocity amount in window (ETB)',
            new_device_amount: 'New device + amount (ETB)',
            multi_account_device: 'Device multi-account threshold',
            shared_ip_accounts: 'Shared IP account threshold',
            large_withdrawal: 'Large withdrawal (ETB)',
            rapid_transfer_amount: 'Rapid transfer amount (ETB)',
            rapid_window_minutes: 'Rapid window (minutes)'
        };
        async function load() {
            const rules = await API.getFraudRules();
            const el = document.getElementById('fields');
            el.innerHTML = Object.keys(labels).map(k => `
                <div class="col-md-4">
                    <label class="form-label">${labels[k]}</label>
                    <input type="number" class="form-control" id="f_${k}" value="${rules[k] ?? ''}">
                </div>`).join('');
            if (role !== 'admin') {
                document.getElementById('btnSave').disabled = true;
                document.querySelectorAll('#fields input').forEach(i => i.disabled = true);
            }
        }
        async function save() {
            const data = {};
            Object.keys(labels).forEach(k => { data[k] = document.getElementById('f_' + k).value; });
            try {
                await API.updateFraudRules(data);
                showToast('Thresholds saved');
                load();
            } catch (e) { showToast(e.message, 'error'); }
        }
        load().catch(e => showToast(e.message, 'error'));
    </script>
</body>
</html>
