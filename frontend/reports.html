<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Ethio-Cyber Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid py-4 px-4">
        <h3 class="page-title mb-3"><i class="bi bi-file-earmark-bar-graph me-2 text-success"></i>Reports</h3>
        <div class="row g-3 mb-4">
            <div class="col-md-3"><label class="form-label">Period (days)</label>
                <select class="form-select" id="days" onchange="loadSummary()">
                    <option value="1">1</option><option value="7" selected>7</option>
                    <option value="30">30</option><option value="90">90</option>
                </select></div>
        </div>
        <div class="row g-3 mb-4" id="summaryCards"></div>
        <div class="card">
            <div class="card-header">Export CSV</div>
            <div class="card-body d-flex flex-wrap gap-2">
                <button class="btn btn-outline-success btn-sm" onclick="downloadCsv('transactions')">Transactions</button>
                <button class="btn btn-outline-success btn-sm" onclick="downloadCsv('alerts')">Alerts</button>
                <button class="btn btn-outline-success btn-sm" onclick="downloadCsv('incidents')">Incidents</button>
                <button class="btn btn-outline-success btn-sm" onclick="downloadCsv('watchlists')">Watchlists</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script>
        if (!requireAuth()) {}
        document.getElementById('navbar').innerHTML = renderNavbar('reports');
        async function loadSummary() {
            const days = document.getElementById('days').value;
            const s = await API.getReportSummary(days);
            document.getElementById('summaryCards').innerHTML = `
                <div class="col-6 col-md-3"><div class="card"><div class="card-body text-center">
                    <div class="stat-value">${s.transactions?.total ?? 0}</div><div class="stat-label">Transactions</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card"><div class="card-body text-center">
                    <div class="stat-value text-danger">${s.transactions?.suspicious ?? 0}</div><div class="stat-label">Suspicious TX</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card"><div class="card-body text-center">
                    <div class="stat-value text-warning">${s.alerts?.open ?? 0}</div><div class="stat-label">Open alerts</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card"><div class="card-body text-center">
                    <div class="stat-value">${s.incidents?.total ?? 0}</div><div class="stat-label">Incidents</div></div></div></div>`;
        }
        async function downloadCsv(type) {
            const days = document.getElementById('days').value;
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/reports/export.csv?type=${type}&days=${days}`, {
                    headers: { 'Authorization': 'Bearer ' + API.getToken() }
                });
                if (!res.ok) throw new Error('Export failed (' + res.status + ')');
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `ecs_${type}_${days}d.csv`;
                a.click();
                showToast('Download started');
            } catch (e) { showToast(e.message, 'error'); }
        }
        loadSummary().catch(e => showToast(e.message, 'error'));
    </script>
</body>
</html>
