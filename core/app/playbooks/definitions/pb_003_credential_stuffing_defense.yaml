id: PB-003-CRED-STUFFING
name: "Credential Stuffing & Login Spray Defense"
description: "Automated defense against distributed credential stuffing and authorization bursts"
version: "1.0.0"
category: "web_api"
is_enabled: true

trigger:
  severity_in:
    - medium
    - high
    - critical
  min_risk_score: 35
  rules_any:
    - AUTH-002
    - API-001
    - IOC-001

actions:
  - name: "Block Aggressive IP"
    connector: block_ip
    target_entity: source_ip
    is_reversible: true
    rollback_connector: revert
    ttl_minutes: 60
    reason: "API Defense: Temporary block on stuffing source IP"

  - name: "Enforce Step-Up Authentication"
    connector: require_step_up
    target_entity: user_id
    is_reversible: false
    reason: "API Defense: Require OTP/MFA re-verification"

notifications:
  - channel: audit_log
