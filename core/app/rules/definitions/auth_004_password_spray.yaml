id: AUTH-004
name: Password Spraying Campaign
description: Single authentication password tested across a wide breadth of distinct accounts from a single IP or CIDR block.
layer: L2
pack: web_api
severity: high
weight: 40
lifecycle_state: live
version: 1.0.0
tags:
  - attack.t1110.003
  - attack.password_spray
  - auth.horizontal_attack
remediation_hints: Enforce CAPTCHA/MFA challenges across targeted accounts, block originating IP range.
detection:
  selection:
    event_type:
      - LOGIN_FAILED
  thresholds:
    distinct_accounts_count: 5
    window_seconds: 180
