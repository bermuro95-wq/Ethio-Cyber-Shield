id: AUTH-002
name: Multi-Account Source Burst (Credential Stuffing)
description: A single source IP targeting multiple distinct accounts with failed authentication within 60s.
layer: L1
pack: web_api
severity: high
weight: 35
lifecycle_state: live
version: 1.0.0
tags:
  - attack.t1110.003
  - attack.credential_access
  - pattern.credential_stuffing
remediation_hints: Apply rate limit or temporary IP perimeter block.
detection:
  selection:
    event_type: LOGIN_FAILED
  window_seconds: 60
  group_by: source_ip
  thresholds:
    distinct_accounts_count: 3
