services:
  - type: web
    name: ethio-cyber-shield
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app --chdir core --workers 2 --threads 16 --worker-class gthread --timeout 60 --keep-alive 5
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TARGET_SYSTEM_URL
        value: "https://honorpay-banking.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: ECS_MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecs-postgres
          property: connectionString

databases:
  - name: ecs-postgres
    databaseName: ecs_db
    user: ecs_admin
    plan: free
    region: oregon
